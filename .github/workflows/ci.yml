name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-e2e:
    name: Web & Server CI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d netstream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netstream
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: dev_jwt_secret_must_be_at_least_32_characters_long_for_security
      COOKIE_SECRET: dev_cookie_secret_must_be_at_least_32_characters_long_for_security
      PUBLIC_IP: 127.0.0.1
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies (FFmpeg & Mediasoup build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Lint codebase
        run: pnpm lint || true

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run Server & Web Unit/Integration tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  python-lab:
    name: Python Network Lab CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest matplotlib

      - name: Run Python TCP Lab tests
        run: pytest lab/tcp -v

      - name: Run Python UDP Lab tests
        run: pytest lab/udp -v

      - name: Run Python Netem experiments tests
        run: pytest lab/experiments -v
