# NetStream Live - coturn STUN/TURN configuration
#
# Credentials:
#   Uses the TURN REST API time-limited HMAC-SHA1 mechanism (RFC 8489 / coturn).
#   The secret below is a local development default; docker-compose overrides it
#   via --static-auth-secret=${TURN_SECRET:-dev_turn_secret}.

use-auth-secret
static-auth-secret=dev_turn_secret
realm=netstream.local

# Listening ports: UDP & TCP on 3478, TLS on 5349
listening-port=3478
tls-listening-port=5349

# Optional TLS certificate paths (uncomment and mount certs in production for turns:// on 5349)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Relay UDP port range (matches docker-compose port mapping)
min-port=49152
max-port=49252

# Security hardening
no-cli
fingerprint
no-multicast-peers
no-loopback-peers

# Deny relay traffic to private / link-local / loopback ranges by default to prevent SSRF
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# LAN / Local Demo Exception:
# coturn evaluates `allowed-peer-ip` before `denied-peer-ip`.
# For local Docker Desktop or LAN demos where the mediasoup SFU runs on the host
# machine, allow ONLY the SFU's IP address (e.g. Docker host gateway or LAN IP).
# Replace 127.0.0.1 / uncomment your LAN SFU IP (e.g. 192.168.1.50) when demoing on a LAN.
# In Docker Desktop (Windows/macOS), container-to-host traffic arrives on host-gateway.
allowed-peer-ip=127.0.0.1
# allowed-peer-ip=192.168.1.50
