# =============================================================================
# NetStream Live - Production Docker Compose Stack
# =============================================================================
#
# NOTE ON DOCKER DESKTOP (Windows & macOS):
# WebRTC media streaming relies heavily on high-throughput UDP packet delivery
# across ports 40000-40100. Docker Desktop's user-space VM proxy (`vpnkit`/`wsl-proxy`)
# can cause packet drop or UDP mapping failure on Windows/macOS.
# For production deployments, deploy on native Linux with host networking (`network_mode: host`)
# or run the server natively outside Docker on Windows/macOS (`pnpm dev`) for local LAN demos.
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: netstream-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: netstream-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/netstream
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_key_32_chars_min}
      COOKIE_SECRET: ${COOKIE_SECRET:-production_secure_cookie_secret_key_32_min}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 40100
      TURN_HOST: ${TURN_HOST:-127.0.0.1}
      TURN_SECRET: ${TURN_SECRET:-dev_turn_secret}
      HLS_ENABLED: 'true'
      HLS_DIR: /app/media/hls
      VOD_DIR: /app/media/vod
      LOG_LEVEL: info
    ports:
      - '3000:3000'
      - '40000-40100:40000-40100/udp'
      - '40000-40100:40000-40100/tcp'
    volumes:
      - hls_data:/app/media/hls
      - vod_data:/app/media/vod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: netstream-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: netstream
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d netstream']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netstream-redis-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: netstream-coturn-prod
    restart: unless-stopped
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:-dev_turn_secret}
      - --external-ip=${PUBLIC_IP:-127.0.0.1}
      - --allowed-peer-ip=${PUBLIC_IP:-127.0.0.1}
      - --log-file=stdout
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '5349:5349/tcp'
      - '49152-49252:49152-49252/udp'

volumes:
  postgres_data:
  redis_data:
  hls_data:
  vod_data:
  caddy_data:
  caddy_config:
